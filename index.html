<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Video Downloader</title>
    <!-- Telegram Web App JS SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f9);
            color: var(--tg-theme-text-color, #222);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--tg-theme-secondary-bg-color, #fff);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 { font-size: 18px; text-align: center; margin-bottom: 15px; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        button:active { opacity: 0.8; }
        #result { margin-top: 20px; text-align: center; }
        .video-title { font-weight: bold; font-size: 14px; margin: 10px 0; }
        img { width: 100%; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>📥 Video Downloader</h2>
        <input type="text" id="videoUrl" placeholder="YouTube သို့မဟုတ် TikTok လင့်ခ်ထည့်ပါ...">
        <button onclick="fetchVideo()">ဗီဒီယိုရှာမည်</button>
        
        <div id="result"></div>
    </div>

    <script>
        // Telegram WebApp ကို initialize လုပ်ခြင်း
        let tg = window.Telegram.WebApp;
        tg.expand();

        async function fetchVideo() {
            let url = document.getElementById('videoUrl').value;
            let resultDiv = document.getElementById('result');
            
            if (!url) {
                alert('ကျေးဇူးပြု၍ လင့်ခ်တစ်ခု ထည့်ပါ။');
                return;
            }

            resultDiv.innerHTML = "ခေတ္တစောင့်ပါ... ရှာဖွေနေသည်...";

            try {
                // ကိုယ့် Backend Server လင့်ခ်နဲ့ ချိတ်ရန် (ဥပမာ - https://your-backend.onrender.com/get-video)
                let response = await fetch('http://127.0.0.1:8000/get-video', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                let data = await response.json();

                if (data.success) {
                    resultDiv.innerHTML = `
                        <div class="video-title">${data.title}</div>
                        <img src="${data.thumbnail}" alt="Thumbnail">
                        <br><br>
                        <a href="${data.download_url}" target="_blank">
                            <button style="background-color: #28a745;">ဗီဒီယို ဒေါင်းလုပ်ဆွဲရန်</button>
                        </a>
                    `;
                } else {
                    resultDiv.innerHTML = "ဗီဒီယို အချက်အလက်ရယူရန် မအောင်မြင်ပါ။";
                }
            } catch (error) {
                resultDiv.innerHTML = "ဆာဗာသို့ ချိတ်ဆက်၍ မရပါ။ ကျေးဇူးပြု၍ ထပ်မံကြိုးစားပါ။";
            }
        }
    </script>
</body>
</html>
