<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader Mini App</title>
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background: #0f172a;
            color: #fff;
            padding: 20px;
            text-align: center;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #1d4ed8;
        }
        .result {
            margin-top: 20px;
            text-align: left;
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        img {
            width: 100%;
            border-radius: 6px;
            margin-top: 10px;
        }
        .download-btn {
            display: block;
            text-align: center;
            background: #16a34a;
            color: white;
            padding: 10px;
            border-radius: 6px;
            text-decoration: none;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>📥 Video Downloader</h2>
        <p style="font-size: 14px; color: #94a3b8;">YouTube သို့မဟုတ် TikTok လင့်ခ်ကို ထည့်ပါ</p>
        
        <input type="text" id="urlInput" placeholder="လင့်ခ်ကို ဤနေရာတွင် ကူးထည့်ပါ...">
        <button onclick="downloadVideo()">အချက်အလက် ရယူမည်</button>

        <div id="result" class="result">
            <h4 id="videoTitle" style="margin: 0 0 10px 0; font-size: 16px;"></h4>
            <img id="videoThumb" src="" alt="Thumbnail">
            <a id="downloadBtn" class="download-btn" href="" target="_blank">ဗီဒီယို ဒေါင်းလုပ်ဆွဲရန်</a>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        async function downloadVideo() {
            let url = document.getElementById('urlInput').value.trim();
            if (!url) {
                alert('ကျေးဇူးပြု၍ ဗီဒီယိုလင့်ခ်တစ်ခု ထည့်ပါ');
                return;
            }

            alert('ခဏစောင့်ပါ၊ ဆာဗာမှ ဆွဲထုတ်နေပါပြီ...');

            try {
                // Render Backend URL အသစ်ချိတ်ဆက်ထားခြင်း
                let response = await fetch('https://videodownloader-89ye.onrender.com/get-video', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                let data = await response.json();

                if (data.success) {
                    document.getElementById('videoTitle').innerText = data.title;
                    document.getElementById('videoThumb').src = data.thumbnail;
                    document.getElementById('downloadBtn').href = data.download_url;
                    document.getElementById('result').style.display = 'block';
                } else {
                    alert('အမှားအယွင်းရှိသည်: ' + (data.detail || 'မအောင်မြင်ပါ'));
                }
            } catch (error) {
                alert('ချိတ်ဆက်မှု အမှားအယွင်းရှိသည်: ' + error);
            }
        }
    </script>
</body>
</html>
